<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact – XYCarto</title>
    <meta name="description" content="Get in touch with XYCarto — geospatial development, engineering, and cartography.">
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;600&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>

    <!-- ==============================
         NAVIGATION
         ============================== -->
    <nav class="site-nav" id="site-nav">
        <a href="index.html" class="nav-logo">
            <img src="img/ui/xycarto_white_bg.png" alt="XYCarto">
        </a>
        <ul class="nav-links" id="nav-links">
            <li><a href="gallery.html">Gallery</a></li>
            <li><a href="https://github.com/xycarto" target="_blank" rel="noopener noreferrer">GitHub</a></li>
            <li><a href="contact.html" class="nav-active">Contact</a></li>
        </ul>
        <button class="nav-toggle" id="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
            <span></span><span></span><span></span>
        </button>
    </nav>

    <!-- ==============================
         PAGE HEADER
         ============================== -->
    <header class="page-header">
        <p class="page-header-eyebrow">XYCarto</p>
        <h1 class="page-header-title">Contact</h1>
    </header>

    <!-- ==============================
         CONTACT BODY
         ============================== -->
    <main class="contact-wrap">

        <!-- Details -->
        <section class="contact-details">

            <div class="contact-row">
                <span class="contact-label">Location</span>
                <span class="contact-value">Brisbane, Queensland, AU</span>
            </div>

            <div class="contact-row">
                <span class="contact-label">Email</span>
                <a class="contact-value contact-link"
                   href="mailto:ian@xycarto.com">
                    ian[at]xycarto.com
                </a>
            </div>

            <div class="contact-row">
                <span class="contact-label">LinkedIn</span>
                <a class="contact-value contact-link"
                   href="https://linkedin.com/in/ian-reese-45951758"
                   target="_blank" rel="noopener noreferrer">
                    linkedin.com/in/ian-reese-45951758
                </a>
            </div>

            <div class="contact-row">
                <span class="contact-label">GitHub</span>
                <a class="contact-value contact-link"
                   href="https://github.com/xycarto"
                   target="_blank" rel="noopener noreferrer">
                    github.com/xycarto
                </a>
            </div>

        </section>

        <!-- Divider -->
        <div class="contact-divider"></div>

        <!-- Message form — submits directly to ian@xycarto.com via email client -->
        <section class="contact-form-wrap">
            <h2 class="contact-form-heading">Send a Message</h2>

        <form
                class="contact-form"
                action="mailto:ian@xycarto.com"
                method="POST"
                enctype="text/plain"
            >
                <div class="form-row">
                    <label for="name" class="form-label">Name</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        class="form-input"
                        placeholder="Your name"
                        required
                    >
                </div>

                <div class="form-row">
                    <label for="email" class="form-label">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        class="form-input"
                        placeholder="your@email.com"
                        required
                    >
                </div>

                <div class="form-row">
                    <label for="message" class="form-label">Message</label>
                    <textarea
                        id="message"
                        name="message"
                        class="form-input form-textarea"
                        placeholder="What are you working on?"
                        rows="6"
                        required
                    ></textarea>
                </div>

                <button type="submit" class="form-submit">Send Message</button>
            </form>
        </section>

    </main>

    <!-- ==============================
         FOOTER
         ============================== -->
    <footer class="site-footer">
        <p class="footer-name">XYCarto</p>
        <nav class="footer-links">
            <a href="gallery.html">Gallery</a>
            <a href="https://github.com/xycarto" target="_blank" rel="noopener noreferrer">GitHub</a>
            <a href="contact.html">Contact</a>
        </nav>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
