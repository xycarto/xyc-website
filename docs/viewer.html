<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Image – XYCarto</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-bg:     #060c14;
            --color-text:   #f0ede8;
            --color-accent: #c8b99a;
            --font-mono:    'JetBrains Mono', 'Courier New', monospace;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: var(--color-bg);
            overflow: hidden;
            font-family: var(--font-mono);
            -webkit-font-smoothing: antialiased;
        }

        /* ── Toolbar ── */
        #toolbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.5rem;
            background: rgba(6, 10, 20, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(200, 185, 154, 0.12);
        }

        #toolbar-left {
            display: flex;
            align-items: center;
            gap: 1.25rem;
        }

        .tb-btn {
            background: none;
            border: 1px solid rgba(200, 185, 154, 0.25);
            color: var(--color-text);
            font-family: var(--font-mono);
            font-size: 0.68rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            padding: 0.35rem 0.85rem;
            cursor: pointer;
            border-radius: 2px;
            opacity: 0.75;
            transition: opacity 0.2s, border-color 0.2s, color 0.2s;
        }

        .tb-btn:hover {
            opacity: 1;
            border-color: var(--color-accent);
            color: var(--color-accent);
        }

        #zoom-hint {
            font-size: 0.65rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--color-text);
            opacity: 0.35;
        }

        /* ── Viewport ── */
        #viewport {
            position: fixed;
            inset: 52px 0 0 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: zoom-in;
            user-select: none;
            -webkit-user-select: none;
        }

        #viewport.zoomed {
            cursor: grab;
        }

        #viewport.dragging {
            cursor: grabbing;
        }

        #img-wrap {
            position: relative;
            transform-origin: center center;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            will-change: transform;
        }

        #img-wrap.no-transition {
            transition: none;
        }

        #main-img {
            display: block;
            max-width: 100vw;
            max-height: calc(100vh - 52px);
            width: auto;
            height: auto;
            object-fit: contain;
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
        }

        #main-img.loaded {
            opacity: 1;
        }

        /* ── Loading state ── */
        #loading {
            position: fixed;
            inset: 52px 0 0 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--color-text);
            font-size: 0.7rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            opacity: 0.4;
        }

        /* ── Error state ── */
        #error-msg {
            display: none;
            position: fixed;
            inset: 52px 0 0 0;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 1rem;
            color: var(--color-text);
            opacity: 0.5;
            font-size: 0.75rem;
            letter-spacing: 0.1em;
        }
    </style>
</head>
<body>

    <div id="toolbar">
        <div id="toolbar-left">
            <button class="tb-btn" id="btn-close">← Back</button>
            <button class="tb-btn" id="btn-reset">Reset</button>
        </div>
        <span id="zoom-hint">Click to zoom · Drag to pan</span>
    </div>

    <div id="loading">Loading…</div>
    <div id="error-msg">Image not found.</div>

    <div id="viewport">
        <div id="img-wrap">
            <img id="main-img" alt="Map image">
        </div>
    </div>

    <script>
    (function () {

        // ── Grab elements ──────────────────────────────────────
        const viewport = document.getElementById('viewport');
        const imgWrap  = document.getElementById('img-wrap');
        const img      = document.getElementById('main-img');
        const loading  = document.getElementById('loading');
        const errMsg   = document.getElementById('error-msg');
        const btnClose = document.getElementById('btn-close');
        const btnReset = document.getElementById('btn-reset');
        const hint     = document.getElementById('zoom-hint');

        // ── State ──────────────────────────────────────────────
        const ZOOM_LEVEL = 2.5;   // zoom-in multiplier
        let zoomed   = false;
        let dragging = false;
        let startX, startY;       // pointer position when drag begins
        let offsetX = 0;          // current pan offsets
        let offsetY = 0;
        let dragStartOffsetX = 0; // offsets at drag start
        let dragStartOffsetY = 0;

        // ── Load image from URL param ──────────────────────────
        const params   = new URLSearchParams(window.location.search);
        const imgParam = params.get('img');

        if (!imgParam) {
            loading.style.display = 'none';
            errMsg.style.display  = 'flex';
        } else {
            img.src = imgParam;
            img.addEventListener('load', function () {
                loading.style.display = 'none';
                img.classList.add('loaded');
            });
            img.addEventListener('error', function () {
                loading.style.display = 'none';
                errMsg.style.display  = 'flex';
            });
        }

        // ── Apply transform ────────────────────────────────────
        function applyTransform(animate) {
            imgWrap.classList.toggle('no-transition', !animate);
            const scale = zoomed ? ZOOM_LEVEL : 1;
            imgWrap.style.transform =
                'translate(' + offsetX + 'px, ' + offsetY + 'px) scale(' + scale + ')';
        }

        // ── Reset to fit view ──────────────────────────────────
        function resetView(animate) {
            zoomed  = false;
            offsetX = 0;
            offsetY = 0;
            viewport.classList.remove('zoomed', 'dragging');
            hint.textContent = 'Click to zoom · Drag to pan';
            applyTransform(animate !== false);
        }

        // ── Clamp pan so image doesn't wander off screen ───────
        function clampOffsets() {
            if (!zoomed) return;
            const vw = viewport.clientWidth;
            const vh = viewport.clientHeight;
            const iw = img.clientWidth  * ZOOM_LEVEL;
            const ih = img.clientHeight * ZOOM_LEVEL;
            const maxX = Math.max(0, (iw - vw) / 2);
            const maxY = Math.max(0, (ih - vh) / 2);
            offsetX = Math.min(maxX, Math.max(-maxX, offsetX));
            offsetY = Math.min(maxY, Math.max(-maxY, offsetY));
        }

        // ── Click to toggle zoom ───────────────────────────────
        viewport.addEventListener('click', function (e) {
            // Ignore if we just finished a drag
            if (dragging) return;

            if (!zoomed) {
                zoomed = true;
                viewport.classList.add('zoomed');
                hint.textContent = 'Drag to pan · Click to zoom out';
                applyTransform(true);
            } else {
                resetView(true);
            }
        });

        // ── Drag to pan ────────────────────────────────────────
        viewport.addEventListener('pointerdown', function (e) {
            if (!zoomed) return;
            dragging = true;
            startX = e.clientX;
            startY = e.clientY;
            dragStartOffsetX = offsetX;
            dragStartOffsetY = offsetY;
            viewport.classList.add('dragging');
            viewport.setPointerCapture(e.pointerId);
            e.preventDefault();
        });

        viewport.addEventListener('pointermove', function (e) {
            if (!dragging) return;
            offsetX = dragStartOffsetX + (e.clientX - startX);
            offsetY = dragStartOffsetY + (e.clientY - startY);
            clampOffsets();
            applyTransform(false);
        });

        function endDrag(e) {
            if (!dragging) return;
            dragging = false;
            viewport.classList.remove('dragging');
            // If mouse barely moved, treat as a click (handled above)
            const moved = Math.abs(e.clientX - startX) + Math.abs(e.clientY - startY);
            if (moved < 5) return;
            // Prevent the click event from firing after a real drag
            viewport.addEventListener('click', stopClick, { once: true, capture: true });
        }

        function stopClick(e) { e.stopPropagation(); }

        viewport.addEventListener('pointerup',     endDrag);
        viewport.addEventListener('pointercancel', endDrag);

        // ── Buttons ────────────────────────────────────────────
        btnClose.addEventListener('click', function () { window.close(); });
        btnReset.addEventListener('click', function () { resetView(true); });

        // ── Keyboard shortcuts ─────────────────────────────────
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') resetView(true);
        });

    }());
    </script>

</body>
</html>
